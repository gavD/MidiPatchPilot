<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MultiMIDI Patch Editor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">MultiMIDI <span class="app-version">v0.1.0</span></p>
          <h1 id="instrument-title">Patch Editor</h1>
        </div>
        <div class="midi-pill" id="midi-status" role="status">MIDI not connected</div>
      </header>

      <main class="workspace" aria-label="MIDI patch editor">
        <aside class="side-panel" aria-label="Instrument and MIDI setup">
          <section class="panel-block">
            <div class="section-heading">
              <h2>Instrument</h2>
              <label class="file-picker" title="Load a YAML file from your device that confiigured MultiMidi for your MIDI instrument">
                <span>Load from disk</span>
                <input id="yaml-file" type="file" accept=".yaml,.yml,text/yaml,text/plain">
              </label>
            </div>
            <label class="field-label" for="preset-select">Preset</label>
            <select id="preset-select" aria-label="Instrument"></select>
            <textarea id="yaml-editor" spellcheck="false" aria-label="Instrument YAML editor"></textarea>
            <div class="parse-status" id="parse-status" role="status"></div>
          </section>

          <section class="panel-block">
            <h2 id="patch-heading">Patches</h2>
            <div class="patch-save-row">
              <input id="patch-name" type="text" autocomplete="off" placeholder="Patch name" aria-label="Patch name">
              <button class="primary-action" id="save-patch" type="button">Save patch</button>
            </div>
            <ul class="patch-list" id="patch-list"></ul>
            <button class="ghost-action export-patches-action" id="export-patches" type="button">export all patches</button>
            <div class="parse-status" id="patch-status" role="status">No patches saved.</div>
          </section>

          <section class="panel-block">
            <h2>MIDI</h2>
            <label class="field-label" for="midi-channel">Channel</label>
            <select id="midi-channel" aria-label="MIDI channel"></select>

            <label class="field-label" for="midi-output">Output</label>
            <select id="midi-output" aria-label="MIDI output"></select>

            <label class="field-label" for="midi-input">Input</label>
            <select id="midi-input" aria-label="MIDI input"></select>

            <button class="primary-action" id="connect-midi" type="button">
              <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M4 8h16M4 16h16M8 4v16M16 4v16"></path>
                </svg>
              </span>
              Connect MIDI
            </button>
          </section>

          <section class="panel-block">
            <h2>Test Area</h2>
            <div class="test-play-row">
              <button class="secondary-action" id="play-note" type="button">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M8 5v14l11-7z"></path>
                  </svg>
                </span>
                Play middle C
              </button>
              <label class="checkbox-row" title="loop every 3 seconds">
                <input id="loop-note" type="checkbox">
                <span>loop</span>
              </label>
            </div>
            <div class="transport-row">
              <button class="transport-action" id="send-start" type="button">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M8 5v14l11-7z"></path>
                  </svg>
                </span>
                Start
              </button>
              <button class="transport-action" id="send-stop" type="button">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path d="M7 7h10v10H7z"></path>
                  </svg>
                </span>
                Stop
              </button>
              <span class="info-dot" title="Sends MIDI Start and Stop transport messages for instruments that support them." aria-hidden="true">i</span>
            </div>
            <p class="event-log" id="event-log">No MIDI messages sent yet.</p>
          </section>

          <section class="panel-block incoming-log-block" aria-label="Incoming MIDI events">
            <div class="incoming-log-header">
              <div>
                <p class="eyebrow">Incoming MIDI</p>
                <h3 id="incoming-event-count">0 messages</h3>
              </div>
              <button class="ghost-action" id="clear-incoming-events" type="button">Clear</button>
            </div>
            <div class="compact-midi-log" id="incoming-event-log" aria-live="polite"></div>
          </section>
        </aside>

        <section class="editor-panel" aria-label="CC editor">
          <div class="toolbar">
            <div>
              <p class="eyebrow">Live controls</p>
              <h2 id="control-summary">No instrument loaded</h2>
            </div>
            <div class="toolbar-actions">
              <button class="ghost-action" id="randomise-controls" type="button" title="Ransomises the value of all controls">Randomise</button>
            </div>
          </div>
          <div class="controls-grid" id="controls-grid"></div>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
