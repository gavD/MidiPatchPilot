name: Behringer Pro VS Mini
theme:
  name: Pro VS Mini
  colors:
    background: "#111217"
    panel: "#181b22"
    panelAlt: "#232833"
    text: "#f7f1e3"
    muted: "#b4bac4"
    primary: "#5ee1ff"
    accent: "#ffc857"
    danger: "#ff6b7a"
sections:
  - name: Performance
    controls:
      - cc: 1
        label: Modulation
        description: Modulation amount.
        type: vertical-slider
      - cc: 91
        label: Chorus Depth
        description: Chorus depth.
        type: horizontal-slider
        max: 99
      - cc: 92
        label: Chorus Rate
        description: Chorus rate.
        type: horizontal-slider
        max: 99
  - name: Voice Waves
    controls:
      - cc: 24
        label: Voice A Wave
        description: Voice A wavetable selection.
        type: horizontal-slider
      - cc: 25
        label: Voice B Wave
        description: Voice B wavetable selection.
        type: horizontal-slider
      - cc: 26
        label: Voice C Wave
        description: Voice C wavetable selection.
        type: horizontal-slider
      - cc: 27
        label: Voice D Wave
        description: Voice D wavetable selection.
        type: horizontal-slider
  - name: LFO
    controls:
      - cc: 54
        label: LFO 1 Waveform
        description: LFO 1 waveform.
        type: switch
        positions:
          - label: Triangle
            value: 21
          - label: Square
            value: 64
          - label: Saw
            value: 106
      - cc: 55
        label: LFO 2 Waveform
        description: LFO 2 waveform.
        type: switch
        positions:
          - label: Triangle
            value: 21
          - label: Square
            value: 64
          - label: Saw
            value: 106
      - cc: 56
        label: LFO 1 Destination
        description: LFO 1 destination.
        type: switch
        positions:
          - label: VCF
            value: 32
          - label: OSC
            value: 96
      - cc: 70
        label: LFO 1 Amount
        description: LFO 1 modulation amount.
        type: horizontal-slider
        max: 99
      - cc: 28
        label: LFO 2 Amount
        description: LFO 2 modulation amount.
        type: horizontal-slider
        max: 99
      - cc: 72
        label: LFO 1 Rate
        description: LFO 1 rate.
        type: horizontal-slider
        max: 99
      - cc: 73
        label: LFO 2 Rate
        description: LFO 2 rate.
        type: horizontal-slider
        max: 99
  - name: Filter
    controls:
      - cc: 74
        label: Filter Cutoff
        description: Filter cutoff.
        type: vertical-slider
        max: 99
      - cc: 71
        label: Filter Resonance
        description: Filter resonance.
        type: horizontal-slider
        max: 99
      - cc: 47
        label: Filter Env Amount
        description: Filter envelope amount.
        type: horizontal-slider
  - name: Amplifier Envelope
    controls:
      - cc: 81
        label: Amplitude Envelope Attack
        description: Amplitude envelope attack.
        type: horizontal-slider
        max: 99
      - cc: 82
        label: Amplitude Envelope Decay
        description: Amplitude envelope decay.
        type: horizontal-slider
        max: 99
      - cc: 83
        label: Amplitude Envelope Sustain
        description: Amplitude envelope sustain.
        type: horizontal-slider
        max: 99
      - cc: 84
        label: Amplitude Envelope Release
        description: Amplitude envelope release.
        type: horizontal-slider
        max: 99
  - name: Filter Envelope
    controls:
      - cc: 85
        label: Filter Envelope Attack
        description: Filter envelope attack.
        type: horizontal-slider
        max: 99
      - cc: 86
        label: Filter Envelope Decay
        description: Filter envelope decay.
        type: horizontal-slider
        max: 99
      - cc: 87
        label: Filter Envelope Sustain
        description: Filter envelope sustain.
        type: horizontal-slider
        max: 99
      - cc: 88
        label: Filter Envelope Release
        description: Filter envelope release.
        type: horizontal-slider
        max: 99
  - name: Tuning
    controls:
      - cc: 111
        label: Voice A Fine Tuning
        description: Voice A fine tuning.
        type: horizontal-slider
        max: 99
      - cc: 112
        label: Voice B Fine Tuning
        description: Voice B fine tuning.
        type: horizontal-slider
        max: 99
      - cc: 113
        label: Voice C Fine Tuning
        description: Voice C fine tuning.
        type: horizontal-slider
        max: 99
      - cc: 114
        label: Voice D Fine Tuning
        description: Voice D fine tuning.
        type: horizontal-slider
        max: 99
      - cc: 115
        label: Voice A Coarse Tuning
        description: Voice A coarse tuning.
        type: horizontal-slider
        max: 99
      - cc: 116
        label: Voice B Coarse Tuning
        description: Voice B coarse tuning.
        type: horizontal-slider
        max: 99
      - cc: 117
        label: Voice C Coarse Tuning
        description: Voice C coarse tuning.
        type: horizontal-slider
        max: 99
      - cc: 118
        label: Voice D Coarse Tuning
        description: Voice D coarse tuning.
        type: horizontal-slider
        max: 99
