name: Behringer Pro VS Mini
theme:
  name: Pro VS Mini
  colors:
    background: "#111217"
    panel: "#181b22"
    panelAlt: "#232833"
    text: "#f7f1e3"
    muted: "#b4bac4"
    primary: "#5ee1ff"
    accent: "#ffc857"
    danger: "#ff6b7a"
sections:
  - name: Performance
    controls:
      - cc: 1
        label: Modulation
        description: Modulation amount.
        type: horizontal-slider
      - cc: 91
        label: Chorus Depth
        description: Chorus depth.
        type: horizontal-slider
        max: 99
      - cc: 92
        label: Chorus Rate
        description: Chorus rate.
        type: horizontal-slider
        max: 99
  - name: Voice Waves
    controls:
      - cc: 24
        label: Voice A Wave
        description: Voice A wavetable selection.
        type: horizontal-slider
      - cc: 25
        label: Voice B Wave
        description: Voice B wavetable selection.
        type: horizontal-slider
      - cc: 26
        label: Voice C Wave
        description: Voice C wavetable selection.
        type: horizontal-slider
      - cc: 27
        label: Voice D Wave
        description: Voice D wavetable selection.
        type: horizontal-slider
  - name: LFO
    controls:
      - cc: 54
        label: LFO 1 Waveform
        description: LFO 1 waveform.
        type: switch
        positions:
          - label: Triangle
            value: 21
          - label: Square
            value: 64
          - label: Saw
            value: 106
      - cc: 56
        label: LFO 1 Destination
        description: LFO 1 destination.
        type: switch
        positions:
          - label: VCF
            value: 32
          - label: OSC
            value: 96
      - cc: 72
        label: LFO 1 Rate
        description: LFO 1 rate.
        type: horizontal-slider
        max: 99
      - cc: 70
        label: LFO 1 Amount
        description: LFO 1 modulation amount.
        type: horizontal-slider
        max: 99
      - cc: 55
        label: LFO 2 Waveform
        description: LFO 2 waveform.
        type: switch
        positions:
          - label: Triangle
            value: 21
          - label: Square
            value: 64
          - label: Saw
            value: 106
      - cc: 28
        label: LFO 2 Amount
        description: LFO 2 modulation amount.
        type: horizontal-slider
        max: 99
      - cc: 73
        label: LFO 2 Rate
        description: LFO 2 rate.
        type: horizontal-slider
        max: 99
  - name: Filter
    controls:
      - cc: 74
        label: Filter Cutoff
        description: Filter cutoff.
        type: horizontal-slider
        max: 99
      - cc: 71
        label: Filter Resonance
        description: Filter resonance.
        type: horizontal-slider
        max: 99
      - cc: 47
        label: Filter Env Amount
        description: Filter envelope amount.
        type: horizontal-slider
  - name: Amplifier Envelope
    grid-column: span 2
    controls:
      - type: vertical-slider-group
        controls:
          - cc: 81
            label: A
            description: Amplitude envelope attack.
            type: vertical-slider
            max: 99
          - cc: 82
            label: D
            description: Amplitude envelope decay.
            type: vertical-slider
            max: 99
          - cc: 83
            label: S
            description: Amplitude envelope sustain.
            type: vertical-slider
            max: 99
          - cc: 84
            label: R
            description: Amplitude envelope release.
            type: vertical-slider
            max: 99
  - name: Filter Envelope
    grid-column: span 2
    controls:
      - type: vertical-slider-group
        controls:
          - cc: 85
            label: A
            description: Filter envelope attack.
            type: vertical-slider
            max: 99
          - cc: 86
            label: D
            description: Filter envelope decay.
            type: vertical-slider
            max: 99
          - cc: 87
            label: S
            description: Filter envelope sustain.
            type: vertical-slider
            max: 99
          - cc: 88
            label: R
            description: Filter envelope release.
            type: vertical-slider
            max: 99
  - name: Tuning
    grid-column: span 3
    controls:
      - type: vertical-slider-group
        controls:
          - cc: 115
            label: A Coarse
            description: Voice A coarse tuning.
            type: vertical-slider
            max: 99
          - cc: 111
            label: A Fine
            description: Voice A fine tuning.
            type: vertical-slider
            max: 99
          - cc: 116
            label: B Coarse
            description: Voice B coarse tuning.
            type: vertical-slider
            max: 99
          - cc: 112
            label: B Fine
            description: Voice B fine tuning.
            type: vertical-slider
            max: 99
          - cc: 117
            label: C Coarse
            description: Voice C coarse tuning.
            type: vertical-slider
            max: 99
          - cc: 113
            label: C Fine
            description: Voice C fine tuning.
            type: vertical-slider
            max: 99
          - cc: 118
            label: D Coarse
            description: Voice D coarse tuning.
            type: vertical-slider
            max: 99
          - cc: 114
            label: D Fine
            description: Voice D fine tuning.
            type: vertical-slider
            max: 99
